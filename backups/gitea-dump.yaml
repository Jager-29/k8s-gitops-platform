apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-dump
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-dump
  namespace: gitea
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-dump
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-dump
subjects:
  - kind: ServiceAccount
    name: gitea-dump
    namespace: gitea
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-dump
  namespace: gitea
spec:
  schedule: "30 2 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: gitea-dump
          restartPolicy: Never
          containers:
            - name: dump
              image: amazon/aws-cli:2.37.7
              envFrom:
                - secretRef:
                    name: app-dumps-s3
              env:
                - name: AWS_DEFAULT_REGION
                  value: garage
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: S3_ENDPOINT
                  value: http://192.168.10.13:3900
                - name: KUBECTL_VERSION
                  value: v1.30.14
                - name: KUBECTL_SHA256
                  value: 7ccac981ece0098284d8961973295f5124d78eab7b89ba5023f35591baa16271
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  curl -fsSL --connect-timeout 10 --retry 3 -o /work/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
                  echo "${KUBECTL_SHA256}  /work/kubectl" | sha256sum -c -
                  chmod +x /work/kubectl
                  K=/work/kubectl
                  POD="$($K -n gitea get pods -l app.kubernetes.io/name=gitea,app.kubernetes.io/instance=gitea -o jsonpath='{.items[0].metadata.name}')"
                  $K -n gitea exec "$POD" -c gitea -- sh -ec 'rm -f /tmp/gitea-dump.tar.gz; gitea dump --skip-db --type tar.gz --file /tmp/gitea-dump.tar.gz; tar -tzf /tmp/gitea-dump.tar.gz >/dev/null'
                  REMOTE_SUM="$($K -n gitea exec "$POD" -c gitea -- sha256sum /tmp/gitea-dump.tar.gz | cut -d' ' -f1)"
                  $K -n gitea exec "$POD" -c gitea -- cat /tmp/gitea-dump.tar.gz > /work/gitea-dump.tar.gz
                  $K -n gitea exec "$POD" -c gitea -- rm -f /tmp/gitea-dump.tar.gz
                  LOCAL_SUM="$(sha256sum /work/gitea-dump.tar.gz | cut -d' ' -f1)"
                  [ "$REMOTE_SUM" = "$LOCAL_SUM" ]
                  NAME="gitea/gitea-dump-$(date -u +%Y%m%d-%H%M%S).tar.gz"
                  aws --endpoint-url "$S3_ENDPOINT" s3 cp /work/gitea-dump.tar.gz "s3://app-dumps/$NAME"
                  LIMIT="$(date -u -d '7 days ago' +%Y%m%d)"
                  aws --endpoint-url "$S3_ENDPOINT" s3 ls s3://app-dumps/gitea/ | while read -r _day _time _size file; do
                    case "$file" in
                      gitea-dump-[0-9]*.tar.gz)
                        stamp="${file#gitea-dump-}"
                        stamp="${stamp%%-*}"
                        if [ "$stamp" -lt "$LIMIT" ]; then
                          aws --endpoint-url "$S3_ENDPOINT" s3 rm "s3://app-dumps/gitea/$file"
                        fi
                        ;;
                    esac
                  done
                  rm -f /work/gitea-dump.tar.gz
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 5Gi
