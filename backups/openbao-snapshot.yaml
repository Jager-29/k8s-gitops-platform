apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-s3
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-s3
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: backup/openbao
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
spec:
  schedule: "30 3 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.7.0
              env:
                - name: BAO_ADDR
                  value: http://openbao-active.openbao.svc.cluster.local:8200
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  BAO_TOKEN="$(bao write -field=token auth/kubernetes/login role=openbao-snapshot jwt="$JWT")"
                  export BAO_TOKEN
                  bao operator raft snapshot save /backup/openbao.snap
                  ls -l /backup/openbao.snap
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: upload
              image: amazon/aws-cli:2.37.7
              envFrom:
                - secretRef:
                    name: openbao-s3
              env:
                - name: AWS_DEFAULT_REGION
                  value: garage
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                - name: S3_ENDPOINT
                  value: http://192.168.10.13:3900
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  NAME="openbao-$(date -u +%Y%m%d-%H%M%S).snap"
                  aws --endpoint-url "$S3_ENDPOINT" s3 cp /backup/openbao.snap "s3://openbao/$NAME"
                  LIMIT="$(date -u -d '7 days ago' +%Y%m%d)"
                  aws --endpoint-url "$S3_ENDPOINT" s3 ls s3://openbao/ | while read -r _day _time _size file; do
                    case "$file" in
                      openbao-[0-9]*.snap)
                        stamp="${file#openbao-}"
                        stamp="${stamp%%-*}"
                        if [ "$stamp" -lt "$LIMIT" ]; then
                          aws --endpoint-url "$S3_ENDPOINT" s3 rm "s3://openbao/$file"
                        fi
                        ;;
                    esac
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: tmp
              emptyDir: {}
