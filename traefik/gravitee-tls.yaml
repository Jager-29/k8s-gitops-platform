apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tls-gravitee
  namespace: gravitee
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tls-gravitee
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: tls/wildcard-example-com
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: tls/wildcard-example-com
        property: tls.key
