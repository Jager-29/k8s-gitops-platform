apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      releaseName: grafana
      valuesObject:
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        envFromSecret: grafana-oidc
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: local-path
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - grafana.example.com
          tls:
            - hosts:
                - grafana.example.com
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        grafana.ini:
          server:
            root_url: https://grafana.example.com
          auth:
            oauth_auto_login: false
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            allow_sign_up: true
            client_id: grafana
            scopes: openid profile email groups
            auth_url: https://keycloak.example.com/realms/platform/protocol/openid-connect/auth
            token_url: https://keycloak.example.com/realms/platform/protocol/openid-connect/token
            api_url: https://keycloak.example.com/realms/platform/protocol/openid-connect/userinfo
            signout_redirect_url: https://keycloak.example.com/realms/platform/protocol/openid-connect/logout
            use_pkce: true
            login_attribute_path: preferred_username
            email_attribute_path: email
            groups_attribute_path: groups
            role_attribute_path: contains(groups[*], 'GG-K8S-Admins') && 'Admin' || contains(groups[*], 'GG-K8S-Readers') && 'Viewer'
            role_attribute_strict: true
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: ALL
            folderAnnotation: grafana_folder
            provider:
              foldersFromFilesStructure: true
          datasources:
            enabled: true
            label: grafana_datasource
            labelValue: "1"
            searchNamespace: monitoring
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Gravitee Analytics
                uid: gravitee-es
                type: elasticsearch
                access: proxy
                url: http://graviteeio-apim-elasticsearch-ingest-hl.gravitee.svc.cluster.local:9200
                jsonData:
                  index: gravitee-v4-metrics-*
                  timeField: "@timestamp"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
