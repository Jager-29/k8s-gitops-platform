apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apim-platform
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cluster
      targetRevision: 0.8.1
      helm:
        releaseName: gravitee-pg
        valuesObject:
          type: postgresql
          mode: standalone
          version:
            postgresql: "16"
          cluster:
            instances: 1
            storage:
              size: 10Gi
              storageClass: local-path
            monitoring:
              enabled: true
            initdb:
              database: gravitee
              owner: gravitee
              secret:
                name: gravitee-pg-app
            roles:
              - name: keycloak
                ensure: present
                login: true
                passwordSecret:
                  name: keycloak-db-role
            plugins:
              - name: barman-cloud.cloudnative-pg.io
                isWALArchiver: true
                parameters:
                  barmanObjectName: garage
          backups:
            enabled: false
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis
      targetRevision: 20.6.0
      helm:
        releaseName: gravitee-redis
        valuesObject:
          global:
            security:
              allowInsecureImages: true
          image:
            registry: docker.io
            repository: bitnamilegacy/redis
          architecture: standalone
          auth:
            enabled: true
            existingSecret: gravitee-redis
            existingSecretPasswordKey: redis-password
          master:
            persistence:
              enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    - repoURL: https://helm.gravitee.io
      chart: apim
      targetRevision: 4.12.3
      helm:
        releaseName: graviteeio-apim
        valuesObject:
          global:
            security:
              allowInsecureImages: true
          management:
            type: jdbc
          jdbc:
            url: jdbc:postgresql://gravitee-pg-cluster-rw.gravitee.svc.cluster.local:5432/gravitee
            username: gravitee
            driver: https://jdbc.postgresql.org/download/postgresql-42.7.4.jar
          ratelimit:
            type: redis
          redis:
            host: gravitee-redis-master.gravitee.svc.cluster.local
            port: 6379
            ssl: false
          es:
            enabled: true
          elasticsearch:
            enabled: true
            image:
              registry: docker.io
              repository: bitnamilegacy/elasticsearch
          adminPasswordBcrypt: $2a$10$npB3v.OJfmoGq6NGeQF4Fu2kAmBR1EKUhWIwga9eaUBlYRNrEmcpq
          extraInMemoryUsers: ""
          api:
            env:
              - name: gravitee_management_jdbc_password
                valueFrom:
                  secretKeyRef:
                    name: gravitee-secrets
                    key: JDBC_PASSWORD
              - name: gravitee_jwt_secret
                valueFrom:
                  secretKeyRef:
                    name: gravitee-secrets
                    key: JWT_SECRET
              - name: gravitee_api_properties_encryption_secret
                valueFrom:
                  secretKeyRef:
                    name: gravitee-secrets
                    key: PROPERTIES_ENCRYPTION_SECRET
              - name: gravitee_security_providers_1_users_0_password
                valueFrom:
                  secretKeyRef:
                    name: gravitee-secrets
                    key: ADMIN_PASSWORD_BCRYPT
              - name: gravitee_ratelimit_redis_password
                valueFrom:
                  secretKeyRef:
                    name: gravitee-redis
                    key: redis-password
              - name: GIO_MIN_MEM
                value: 512m
              - name: GIO_MAX_MEM
                value: 512m
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              limits:
                memory: 1Gi
            extraVolumes: |
              - name: license
                secret:
                  secretName: gravitee-license
            extraVolumeMounts: |
              - name: license
                mountPath: /opt/graviteeio-management-api/license
                readOnly: true
            ingress:
              management:
                enabled: true
                ingressClassName: traefik
                pathType: Prefix
                path: /management
                hosts:
                  - apim.example.com
                annotations:
                  kubernetes.io/ingress.class: null
                  traefik.ingress.kubernetes.io/router.entrypoints: websecure
                tls:
                  - hosts:
                      - apim.example.com
                    secretName: tls-gravitee
              portal:
                enabled: true
                ingressClassName: traefik
                pathType: Prefix
                path: /portal
                hosts:
                  - apim.example.com
                annotations:
                  kubernetes.io/ingress.class: null
                  traefik.ingress.kubernetes.io/router.entrypoints: websecure
                tls:
                  - hosts:
                      - apim.example.com
                    secretName: tls-gravitee
          gateway:
            env:
              - name: gravitee_management_jdbc_password
                valueFrom:
                  secretKeyRef:
                    name: gravitee-secrets
                    key: JDBC_PASSWORD
              - name: gravitee_api_properties_encryption_secret
                valueFrom:
                  secretKeyRef:
                    name: gravitee-secrets
                    key: PROPERTIES_ENCRYPTION_SECRET
              - name: gravitee_ratelimit_redis_password
                valueFrom:
                  secretKeyRef:
                    name: gravitee-redis
                    key: redis-password
              - name: gravitee_tags
                value: internal
              - name: GIO_MIN_MEM
                value: 512m
              - name: GIO_MAX_MEM
                value: 512m
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              limits:
                memory: 1Gi
            extraVolumes: |
              - name: license
                secret:
                  secretName: gravitee-license
            extraVolumeMounts: |
              - name: license
                mountPath: /opt/graviteeio-gateway/license
                readOnly: true
            reporters:
              tcp:
                enabled: true
                host: logstash-logstash.gravitee.svc.cluster.local
                port: 8379
                output: json
            ingress:
              enabled: true
              ingressClassName: traefik
              pathType: Prefix
              path: /
              hosts:
                - apim-gw.example.com
              annotations:
                kubernetes.io/ingress.class: null
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              tls:
                - hosts:
                    - apim-gw.example.com
                  secretName: tls-gravitee
          ui:
            ingress:
              enabled: true
              ingressClassName: traefik
              pathType: Prefix
              path: /console
              hosts:
                - apim.example.com
              annotations:
                kubernetes.io/ingress.class: null
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.middlewares: gravitee-console-strip@kubernetescrd
              tls:
                - hosts:
                    - apim.example.com
                  secretName: tls-gravitee
          portal:
            ingress:
              enabled: true
              ingressClassName: traefik
              pathType: Prefix
              path: /
              hosts:
                - apim.example.com
              annotations:
                kubernetes.io/ingress.class: null
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              tls:
                - hosts:
                    - apim.example.com
                  secretName: tls-gravitee
  destination:
    server: https://kubernetes.default.svc
    namespace: gravitee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
