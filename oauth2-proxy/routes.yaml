apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.example.com`) && PathPrefix(`/oauth2/`)
      services:
        - name: oauth2-proxy
          port: 80
  tls: {}
