apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-runner
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: gitea/runner
        property: token
