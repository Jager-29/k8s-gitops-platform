apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-garage
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: velero-garage
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
  dataFrom:
    - extract:
        key: backup/velero
